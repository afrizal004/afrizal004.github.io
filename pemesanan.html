<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Menu Pemesanan Boba Drink</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fdf2f2;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #6b4f4f;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #25D366; /* Warna Hijau WA */
            color: white;
            border: none;
            padding: 12px;
            margin-top: 25px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background: #128C7E;
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            background: #e7ffe7;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🍹 Menu Boba Drink</h2>

    <label for="nama">Nama Pemesan:</label>
    <input type="text" id="nama" placeholder="Tulis nama kamu...">

    <label for="rasa">Pilih Rasa:</label>
    <select id="rasa">
        <option value="Chocolate">Chocolate 🍫</option>
        <option value="Matcha">Matcha 🍵</option>
        <option value="Strawberry">Strawberry 🍓</option>
        <option value="Taro">Taro 💜</option>
        <option value="Vanilla">Vanilla 🍦</option>
    </select>

    <label for="ukuran">Pilih Ukuran:</label>
    <select id="ukuran">
        <option value="180ml">180 ml (Reguler)</option>
        <option value="220ml">220 ml (Large)</option>
    </select>

    <button onclick="kirimWA()">Kirim ke WhatsApp</button>

    <div class="result" id="hasil" style="display:none;">
        ✅ Sedang mengalihkan ke WhatsApp...
    </div>
</div>

<script>
    function kirimWA() {
        // 1. Ambil data dari input
        const nama = document.getElementById("nama").value;
        const rasa = document.getElementById("rasa").value;
        const ukuran = document.getElementById("ukuran").value;

        // 2. Validasi: Nama tidak boleh kosong
        if(nama.trim() === "") {
            alert("Silakan masukkan nama kamu terlebih dahulu!");
            return;
        } 

        const pesanTeks = 
            "Halo Admin, saya ingin memesan Boba!%0A%0A" +
            "*Detail Pesanan*%0A" +
            "----------------------------%0A" +
            " *Nama:* " + nama + "%0A" +
            " *Rasa:* " + rasa + "%0A" +
            " *Ukuran:* " + ukuran + "%0A" +
            "----------------------------%0A%0A" +
            "Mohon segera diproses ya, terima kasih!";

        const url = "https://wa.me/6285815069248" + "?text=" + pesanTeks;

        document.getElementById("hasil").style.display = "block";

        window.open(url, '_blank').focus();
    }
</script>

</body>
</html>
