<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afrizal Boba - Halaman Utama</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {x
      margin: 0;
      font-family: 'Poppins', sans-serif;
      text-align: center;
    }

    nav {
      background-color: rgba(255, 111, 145, 0.9);
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(6px);
    }

    nav h1 {
      color: white;
      margin: 0;
    }

    .hero {
      height: 100vh;
       background: url('https://tse4.mm.bing.net/th/id/OIP.49WNI8wbAUaX_t7HVPHOTAHaHa?rs=1&pid=ImgDetMain&o=7&rm=3') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      color: white;
      padding: 20px;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.15);
      top: 0;
      left: 0;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      animation: fadeIn 1.5s ease;
    }

    .hero h2 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .hero p {
      max-width: 500px;
      margin: 0 auto 25px;
      font-size: 1.1em;
    }

    .btn-masuk {
      padding: 15px 35px;
      background-color: #ffe082;
      color: #333;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-masuk:hover {
      background-color: white;
      color: #ff6f91;
      transform: scale(1.08);
    }

    footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      color: white;
      font-size: 0.9em;
      z-index: 1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

<nav>
  <h1>🧋 Afrizal Boba Drink</h1>
</nav>

<div class="hero">
  <div class="hero-content">
    <h2>Selamat Datang</h2>
    <p>
      Segarnya boba drink dengan berbagai varian rasa modern, cocok dinikmati kapan saja!
    </p>
    <a href="halamanutama.html" class="btn-masuk">Masuk ke Menu</a>
  </div>

  <footer>
    <p>© 2026 Afrizal Boba Drink</p>
    <p>Jumlah Pengunjung: <span id="counter">0</span></p>
  </footer>
</div>

<script>
  if (localStorage.getItem("visits")) {
    localStorage.setItem("visits", Number(localStorage.getItem("visits")) + 1);
  } else {
    localStorage.setItem("visits", 1);
  }
  
  document.getElementById("counter").innerText = localStorage.getItem("visits");
</script>

</body>
</html>
