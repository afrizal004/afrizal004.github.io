<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afrizal Boba - Halaman Utama</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #fff8f0;
      color: #333;
      text-align: center;
    }

    nav {
      background-color: #ff6f91;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav h1 {
      color: #fff;
      margin: 0;
    }
    
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff6f91, #ff9671);
      color: #fff;
      padding: 20px;
    }

    .hero h2 {
      font-size: 3em;
      margin-bottom: 15px;
    }

    .hero p {
      max-width: 500px;
      margin-bottom: 30px;
    }

    .btn-masuk {
      padding: 15px 40px;
      background-color: #ffe082;
      color: #333;
      text-decoration: none;
      font-weight: bold;
      border-radius: 30px;
      transition: 0.3s;
    }

    .btn-masuk:hover {
      background-color: #fff;
      color: #ff6f91;
      transform: scale(1.05);
    }

    footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      color: #fff;
      font-size: 0.9em;
    }
  </style>
</head>

<body>

<nav>
  <h1>🧋 Afrizal Boba</h1>
</nav>

<div class="hero">
  <h2>Selamat Datang</h2>
  <p>Minuman boba segar dengan rasa kekinian yang bikin nagih setiap hari!</p>

  <a href="halamanutama.html" class="btn-masuk">Masuk ke Menu</a>
</div>

<footer>
  <p>© 2026 Afrizal Boba Drink</p>
</footer>

</body>
</html>
